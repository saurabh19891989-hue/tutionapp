# Builds the app and publishes it free on GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Optional: Settings → Secrets and variables → Actions → Variables:
#   SUPABASE_URL, SUPABASE_ANON_KEY  (otherwise public/config.js is used as-is)
name: Deploy to GitHub Pages

on:
  push:
    # the repo's default branch is currently claude/nice-pasteur-vusfzl;
    # GitHub Pages only deploys from the default branch
    branches: [main, claude/nice-pasteur-vusfzl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Write Supabase settings from repository variables
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          sed -i "s|https://YOUR-PROJECT-ID.supabase.co|${SUPABASE_URL}|; s|YOUR-ANON-OR-PUBLISHABLE-KEY|${SUPABASE_ANON_KEY}|" dist/config.js
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
