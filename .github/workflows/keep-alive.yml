# Free Supabase projects pause after ~7 days without any activity
# (e.g. during school holidays). This pings the database twice a week.
# Reads the Supabase URL + publishable key from public/config.js
# (repository variables SUPABASE_URL / SUPABASE_ANON_KEY override them).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: public/config.js
          sparse-checkout-cone-mode: false
      - env:
          VAR_URL: ${{ vars.SUPABASE_URL }}
          VAR_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          URL="${VAR_URL:-$(sed -n "s/.*SUPABASE_URL: *'\([^']*\)'.*/\1/p" public/config.js)}"
          KEY="${VAR_KEY:-$(sed -n "s/.*SUPABASE_ANON_KEY: *'\([^']*\)'.*/\1/p" public/config.js)}"
          case "$URL" in *YOUR-PROJECT-ID*|"") echo "Supabase not configured yet"; exit 0;; esac
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL/rest/v1/app_settings?select=id" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $code"
