# Free Supabase projects pause after ~7 days without any activity
# (e.g. during school holidays). This pings the database twice a week.
# Needs repository variables SUPABASE_URL and SUPABASE_ANON_KEY.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - run: |
          curl -sS -o /dev/null -w "%{http_code}\n" "${{ vars.SUPABASE_URL }}/rest/v1/app_settings?select=id" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}"
